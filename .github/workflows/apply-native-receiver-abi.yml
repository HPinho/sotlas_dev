name: Apply isolated native receiver ABI

on:
  push:
    branches:
      - work/native-receiver-abi
    paths:
      - .tmp_apply_native_receiver_abi.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/native-receiver-abi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .tmp_apply_native_receiver_abi.py
      - run: |
          git config user.name "sotlas-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bootstrap/sotlas/native_compiler/sema.sotlas bootstrap/sotlas/native_compiler/emitter_c.sotlas bootstrap/sotlas/native_compiler/main.sotlas
          git diff --cached --check
          git commit -m "feat(selfhost): add bounded native receiver ABI"
          git push origin HEAD:work/native-receiver-abi

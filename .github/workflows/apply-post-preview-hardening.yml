name: Apply isolated compiler hardening

on:
  push:
    branches:
      - work/post-preview-compiler-hardening
    paths:
      - .tmp_apply_post_preview_hardening.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/post-preview-compiler-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reviewed source transformations
        run: python .tmp_apply_post_preview_hardening.py
      - name: Commit hardened compiler sources
        run: |
          git config user.name "sotlas-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bootstrap/sotlas/native_compiler/emitter_c.sotlas bootstrap/sotlas/native_compiler/main.sotlas tests/test_sotlas_native_struct_literal_sema.py docs/sotlas_implementation_status.md
          git diff --cached --check
          git commit -m "feat(selfhost): canonicalize native struct literal lowering"
          git push origin HEAD:work/post-preview-compiler-hardening

name: Sotlas Release & Packaging

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Preview version (for example, 1.0.0rc1)"
        required: false
      dry_run:
        description: "Upload the candidate assets for review without publishing"
        type: boolean
        default: true

permissions:
  actions: read
  contents: write

concurrency:
  group: sotlas-preview-release
  cancel-in-progress: false

jobs:
  build-packages:
    name: Build Preview Toolchain Packages
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Verify requested release version
      id: release_version
      shell: pwsh
      env:
        REQUESTED_PREVIEW_VERSION: ${{ inputs.version }}
        RELEASE_REF: ${{ github.ref }}
        RELEASE_REF_NAME: ${{ github.ref_name }}
      run: |
        $runtimeVersion = python -c "import sys; sys.path.insert(0, 'compiler'); import sotlas; print(sotlas.SOTLAS_VERSION)"
        if ($LASTEXITCODE -ne 0 -or $runtimeVersion -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)rc[1-9][0-9]*$') {
          throw "Expected a release candidate version such as 1.0.0rc1; got '$runtimeVersion'"
        }
        if ($env:GITHUB_EVENT_NAME -eq "push") {
          $requestedVersion = $env:RELEASE_REF_NAME.Substring(1)
        } else {
          if ($env:RELEASE_REF -cne "refs/heads/main") {
            throw "Manual preview releases must be dispatched from main; ref=$env:RELEASE_REF"
          }
          $requestedVersion = $env:REQUESTED_PREVIEW_VERSION
          if ([string]::IsNullOrEmpty($requestedVersion)) { $requestedVersion = $runtimeVersion }
        }
        if ($requestedVersion -cne $runtimeVersion) {
          throw "Release version mismatch: requested=$requestedVersion runtime=$runtimeVersion"
        }
        "version=$runtimeVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "RELEASE_VERSION=$runtimeVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "Validated Sotlas preview version $runtimeVersion"

    - name: Prepare versioned release notes
      shell: pwsh
      run: |
        $version = [regex]::Escape($env:RELEASE_VERSION)
        $changelog = Get-Content CHANGELOG.md -Raw
        $section = [regex]::Match($changelog, "(?ms)^## \[$version\][^\r\n]*\r?\n(?<notes>.*?)(?=^## |\z)")
        $notes = $section.Groups['notes'].Value.Trim()
        if (!$notes) { throw "Missing CHANGELOG.md entry for $env:RELEASE_VERSION" }
        New-Item -ItemType Directory -Path build -Force | Out-Null
        Set-Content -Path build/preview-release-notes.md -Value $notes -Encoding utf8

    - name: Select successful CI for this revision
      id: certified_ci
      shell: pwsh
      env:
        CI_READ_TOKEN: ${{ github.token }}
      run: |
        $revision = git rev-parse HEAD
        if ($LASTEXITCODE -ne 0 -or $revision -cnotmatch '^[0-9a-f]{40}$') { throw 'Could not identify the release revision.' }
        $workflow = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs"
        $headers = @{ Authorization = "Bearer $env:CI_READ_TOKEN"; Accept = 'application/vnd.github+json' }
        $response = Invoke-RestMethod -Uri "$($workflow)?branch=main&head_sha=$revision&status=success" -Headers $headers
        $run = $response.workflow_runs |
          Where-Object { $_.head_sha -ceq $revision -and $_.head_branch -ceq 'main' -and $_.conclusion -ceq 'success' } |
          Select-Object -First 1
        if (!$run) { throw "The release revision $revision requires a successful main CI run." }
        "run_id=$($run.id)" >> $env:GITHUB_OUTPUT
        "Release assets from [CI #$($run.run_number)]($($run.html_url)) for $revision." >> $env:GITHUB_STEP_SUMMARY

    - name: Download certified SDKs and VSIX
      uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: ${{ steps.certified_ci.outputs.run_id }}
        pattern: "sotlas-{terminal-sdk-*,vscode-preview}"
        path: build/preview-ci-assets

    - name: Run full release test suite
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .
        python -m unittest discover -s tests -p "test_*.py"
        if ($LASTEXITCODE -ne 0) { throw "Full Sotlas release test suite failed" }

    - name: Run packaging script
      shell: pwsh
      run: |
        python packaging/package.py --target all --version "$env:RELEASE_VERSION"

    - name: Build Python wheel and source archive
      shell: pwsh
      run: |
        python -m pip install --upgrade build
        python -m build . --outdir dist

    - name: Smoke-test built Python wheel
      shell: pwsh
      run: |
        $wheel = Get-ChildItem dist\sotlas-*.whl | Select-Object -First 1
        if (-not $wheel) { throw "Python wheel was not produced" }
        $target = Join-Path $env:RUNNER_TEMP "sotlas-wheel-smoke"
        python -m pip install --no-deps --target $target $wheel.FullName
        $oldPythonPath = $env:PYTHONPATH
        $env:PYTHONPATH = $target
        python -m sotlas.cli version
        python -m sotlas.doctor --json
        python -m sotlas.cli check examples/01_hello_systems/main.sotlas
        if ($LASTEXITCODE -ne 0) { throw "Wheel smoke test failed" }
        $env:PYTHONPATH = $oldPythonPath

    - name: Verify portable preview artifact set
      shell: pwsh
      run: |
        $required = @(
          "sotlas-v$env:RELEASE_VERSION-windows-x64.zip",
          "sotlas-v$env:RELEASE_VERSION-linux-x64.tar.gz",
          "sotlas-v$env:RELEASE_VERSION-macos-x64.tar.gz"
        )
        foreach ($name in $required) {
          $path = Join-Path "dist" $name
          if (-not (Test-Path $path)) {
            throw "Missing required preview artifact: $name"
          }
        }

    - name: Compile Inno Setup Windows Installer
      shell: pwsh
      run: |
        choco install innosetup --version=6.7.1 --yes --no-progress
        if ($LASTEXITCODE -notin 0, 1641, 3010) { throw "Inno Setup installation failed ($LASTEXITCODE)." }
        $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
        if (!(Test-Path -LiteralPath $iscc -PathType Leaf)) { throw "Inno Setup compiler not found at $iscc" }
        & $iscc packaging/windows/sotlas.iss
        if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed ($LASTEXITCODE)." }
        $installer = "dist/Sotlas-Setup-v$env:RELEASE_VERSION.exe"
        if (!(Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Missing Windows installer: $installer" }

    - name: Rebuild release checksums
      shell: pwsh
      run: |
        & ./packaging/stage-preview-assets.ps1 build/preview-ci-assets dist
        $patterns = @("dist\*.exe", "dist\*.zip", "dist\*.tar.gz", "dist\*.whl", "dist\*.vsix")
        $files = foreach ($pattern in $patterns) {
          Get-ChildItem $pattern -ErrorAction SilentlyContinue
        }
        if (-not $files) { throw "No release artifacts found for checksums" }
        $files | Sort-Object Name -Unique | ForEach-Object {
          $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($_.Name)"
        } | Out-File -Encoding utf8 dist\SHA256SUMS.txt

    - name: Upload preview candidate for review
      if: github.event_name == 'workflow_dispatch' && inputs.dry_run
      uses: actions/upload-artifact@v4
      with:
        name: sotlas-preview-candidate
        path: |
          dist/*.zip
          dist/*.tar.gz
          dist/*.whl
          dist/*.exe
          dist/*.vsix
          dist/SHA256SUMS.txt
          build/preview-release-notes.md
          packaging/install.ps1
          packaging/install.sh
        if-no-files-found: error

    - name: Verify the version has not already been published
      if: github.event_name == 'push' || !inputs.dry_run
      shell: pwsh
      env:
        RELEASE_TOKEN: ${{ github.token }}
      run: |
        $tag = "v$env:RELEASE_VERSION"
        $tagRef = "refs/tags/$tag"
        $refs = git ls-remote origin $tagRef "$tagRef^{}"
        if ($LASTEXITCODE -ne 0) { throw "Could not verify the remote tag $tag" }
        if ($refs) {
          $peeledRef = $refs | Where-Object { $_.EndsWith("`t$tagRef^{}") }
          $tagCommit = (($peeledRef ?? $refs) -split '\s+')[0]
          if ($tagCommit -cne $env:GITHUB_SHA) { throw "Tag $tag points to $tagCommit; expected $env:GITHUB_SHA" }
        }
        $headers = @{ Authorization = "Bearer $env:RELEASE_TOKEN"; Accept = 'application/vnd.github+json' }
        $existing = Invoke-WebRequest -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers $headers -SkipHttpErrorCheck
        if ($existing.StatusCode -eq 200) { throw "Release $tag already exists. Use a new version." }
        if ($existing.StatusCode -ne 404) { throw "Could not verify release $tag (HTTP $($existing.StatusCode))." }

    - name: Create GitHub Preview Release
      if: github.event_name == 'push' || !inputs.dry_run
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v${{ steps.release_version.outputs.version }}"
        target_commitish: ${{ github.sha }}
        name: "Sotlas v${{ steps.release_version.outputs.version }} Preview"
        files: |
          dist/*.zip
          dist/*.tar.gz
          dist/*.whl
          dist/*.exe
          dist/*.vsix
          dist/SHA256SUMS.txt
          packaging/install.ps1
          packaging/install.sh
        draft: false
        prerelease: true
        body_path: build/preview-release-notes.md

name: Sotlas CI & Toolchain Build Farm

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Builds noturnos diários às 02:00 UTC
    - cron: '0 2 * * *'

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # O backend nativo atual inclui intrinsics x86_64; use macOS Intel
        # explicitamente até existir lowering ARM64 equivalente.
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run Sotlas test suite
      run: |
        python -m unittest discover -s tests -p "test_*.py"

    - name: Verify CLI tools & Subcommands
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/cli-smoke
        cat > build/cli-smoke/llvm_supported.sotlas <<'SOTLAS'
        module ci::llvm_smoke;
        pub fn main() -> i32 { return 0; }
        SOTLAS

        sotlas version
        sotlas check examples/01_hello_systems/main.sotlas
        sotlas check examples/02_safe_structures/main.sotlas
        sotlas check examples/03_systems_and_intrinsics/main.sotlas
        sotlas check examples/04_raw_memory_and_unsafe/main.sotlas
        sotlas dump-ast examples/01_hello_systems/main.sotlas
        sotlas dump-sir examples/01_hello_systems/main.sotlas
        sotlas sir-report examples/01_hello_systems/main.sotlas
        sotlas dump-llvm build/cli-smoke/llvm_supported.sotlas --debug
        if sotlas dump-llvm examples/01_hello_systems/main.sotlas --debug > build/cli-smoke/prototype-llvm.txt 2>&1; then
          echo "prototype SIR unexpectedly passed dump-llvm" >&2
          exit 1
        fi
        grep -q "prototype SIR" build/cli-smoke/prototype-llvm.txt
        sotlas fmt examples/01_hello_systems/main.sotlas --check
        sotlas lint examples/01_hello_systems/main.sotlas
        sotlas doc examples/01_hello_systems/main.sotlas -o build/cli-smoke/DOCS.md


  backend-contract:
    name: Check implies valid C11 backend output
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Validate example manifest
      run: python scripts/validate_example_manifest.py

    - name: Verify backend-contract examples satisfy check -> C11 contract
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/check-contract

        python - <<'PY' > build/check-contract/backend-contract.txt
        import json
        data = json.load(open("examples/manifest.json", encoding="utf-8"))
        for item in data["examples"]:
            if item.get("backend_contract") is True:
                print(item["entry"])
        PY

        python - <<'PY' > build/check-contract/native-run.txt
        import json
        data = json.load(open("examples/manifest.json", encoding="utf-8"))
        for item in data["examples"]:
            if item.get("native_run") is True:
                print(item["entry"])
        PY

        while IFS= read -r source; do
          [ -n "$source" ] || continue
          name="$(basename "$(dirname "$source")")"
          output="build/check-contract/${name}.c"

          echo "::group::$source"
          sotlas check "$source"
          sotlas compile "$source" --backend c11 --emit-c -o "$output"
          cc -std=c11 -Wall -Wextra -fsyntax-only "$output"
          if grep -Fxq "$source" build/check-contract/native-run.txt; then
            sotlas run "$source"
          fi
          echo "::endgroup::"
        done < build/check-contract/backend-contract.txt

    - name: Verify Phases 0-3 reality, typed core, ownership, and authority gates
      run: |
        python scripts/generate_phase_gate_matrix.py --check
        python -m unittest discover -s tests -p "test_sotlas_phase_gate_audit.py" -v
        python -m unittest discover -s tests -p "test_sotlas_reality_gate.py" -v
        python -m unittest discover -s tests -p "test_sotlas_phase1_pipeline.py" -v
        python -m unittest discover -s tests -p "test_sotlas_typed_ast_foundation.py" -v
        python -m unittest discover -s tests -p "test_phase2_regression_guard.py" -v
        python -m unittest discover -s tests -p "test_sotlas_phase2_v1_*_release_gate.py" -v
        python -m unittest discover -s tests -p "test_sotlas_sole_ownership.py" -v
        python -m unittest discover -s tests -p "test_sotlas_ownership_soundness.py" -v
        python -m unittest discover -s tests -p "test_sotlas_authority_phase1.py" -v
        python -m unittest discover -s tests -p "test_sotlas_authority_checked_sir.py" -v
        python -m unittest discover -s tests -p "test_sotlas_authority_sir_abi.py" -v

    - name: Verify Phase 4 State Space release subset
      run: |
        python -m unittest discover -s tests -p "test_sotlas_state_frontend.py" -v
        python -m unittest discover -s tests -p "test_sotlas_state_phase1.py" -v

    - name: Verify Phase 5 source Effects release subset
      run: |
        python -m unittest discover -s tests -p "test_sotlas_source_effects.py" -v
        python -m unittest discover -s tests -p "test_sotlas_backend_effect_contract.py" -v

    - name: Verify Phase 6 typed Flow, executable CFG and scheduler subset
      run: |
        sotlas flow-run examples/12_sotlas_by_example/04_flow_cpu.sotlas --flow Compute --workers 2
        python -m unittest discover -s tests -p "test_sotlas_flow_frontend.py" -v
        python -m unittest discover -s tests -p "test_sotlas_flow_cfg.py" -v
        python -m unittest discover -s tests -p "test_sotlas_flow_cfg_runtime.py" -v
        python -m unittest discover -s tests -p "test_sotlas_flow_runtime.py" -v
        python -m unittest discover -s tests -p "test_sotlas_flow_native.py" -v

    - name: Verify Phase 7 execution target contract
      run: |
        python -m unittest discover -s tests -p "test_sotlas_llvm.py" -v

    - name: Verify Phase 8 DEVICE reference source-to-C11 lifecycle
      run: |
        python -m unittest discover -s tests -p "test_sotlas_opencl_gpu_runtime.py" -v
        python -m unittest discover -s tests -p "test_sotlas_device_reference_runtime.py" -v
        python -m unittest discover -s tests -p "test_sotlas_device_checked_c11_pipeline.py" -v
        python -m unittest discover -s tests -p "test_sotlas_device_reference_abi_link.py" -v

    - name: Verify Phase 9 foreign trust boundaries
      run: |
        python -m unittest discover -s tests -p "test_sotlas_source_effects.py" -v
        python -m unittest discover -s tests -p "test_sotlas_unsafe_ffi.py" -v

    - name: Verify Phase 10 precondition and flow refinement subset
      run: |
        python -m unittest discover -s tests -p "test_sotlas_contract_frontend.py" -v
        python -m unittest discover -s tests -p "test_sotlas_contract_report_cli.py" -v

    - name: Verify Phases 11-12 causality and counterfactual subsets
      run: |
        python -m unittest discover -s tests -p "test_sotlas_flow_frontend.py" -v

    - name: Verify Phases 13-15 Transactions, Intent, and canonical SIR
      run: |
        python -m unittest discover -s tests -p "test_sotlas_flow_frontend.py" -v
        python -m unittest discover -s tests -p "test_sotlas_sir.py" -v
        python -m unittest discover -s tests -p "test_sotlas_sir_report_cli.py" -v

    - name: Verify Phase 16 direct LLVM native backend
      run: |
        python -m unittest discover -s tests -p "test_sotlas_llvm_direct_emission.py" -v

    - name: Verify Phase 17 deterministic compiler reports
      run: |
        python -m unittest discover -s tests -p "test_sotlas_contract_report_cli.py" -v
        python -m unittest discover -s tests -p "test_sotlas_flow_report_cli.py" -v
        python -m unittest discover -s tests -p "test_sotlas_sir_report_cli.py" -v

  package-toolchain-snapshot:
    name: Package Nightly Toolchain Snapshot
    runs-on: ubuntu-latest
    needs: [test, backend-contract]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Prepare Toolchain Bundle
      run: |
        mkdir -p dist/sotlas-toolchain
        cp -r compiler tools stdlib runtime include editors examples dist/sotlas-toolchain/
        cp README.md LICENSE pyproject.toml setup.py dist/sotlas-toolchain/
        tar -czf dist/sotlas-toolchain-nightly.tar.gz -C dist sotlas-toolchain

    - name: Upload Toolchain Snapshot Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sotlas-toolchain-nightly
        path: dist/sotlas-toolchain-nightly.tar.gz

  native-linux-package:
    name: Build and install native Linux seed
    runs-on: ubuntu-latest
    needs: [test, backend-contract]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install producer build dependencies
      run: python -m pip install -e .
    - name: Build native seed bundle
      run: python packaging/native_linux.py --output dist/sotlas-native-linux-x64
    - name: Install and run native compiler without host build tools
      shell: bash
      run: |
        set -euo pipefail
        bash packaging/install-native.sh dist/sotlas-native-linux-x64 "$RUNNER_TEMP/sotlas-native"
        printf '%s\n' 'module smoke; pub fn main_entry() -> u32 { return 42; }' > "$RUNNER_TEMP/native-smoke.sotlas"
        env -i PATH=/no-host-tools "$RUNNER_TEMP/sotlas-native/bin/sotlas-native" --check "$RUNNER_TEMP/native-smoke.sotlas"
        env -i PATH=/no-host-tools "$RUNNER_TEMP/sotlas-native/bin/sotlas-native" --check-build "$RUNNER_TEMP" "$RUNNER_TEMP/native-smoke.sotlas"
        env -i PATH=/no-host-tools "$RUNNER_TEMP/sotlas-native/bin/sotlas-native" "$RUNNER_TEMP/native-smoke.sotlas" "$RUNNER_TEMP/native-smoke"
        env -i PATH=/no-host-tools "$RUNNER_TEMP/sotlas-native/bin/sotlas-native" "$RUNNER_TEMP/native-smoke.sotlas" "$RUNNER_TEMP/native-smoke.exe" --windows
        set +e
        env -i PATH=/no-host-tools "$RUNNER_TEMP/native-smoke"
        result=$?
        set -e
        test "$result" -eq 42
    - name: Upload native seed bundle
      uses: actions/upload-artifact@v4
      with:
        name: sotlas-native-linux-x64
        path: |
          dist/sotlas-native-linux-x64.tar.gz
          dist/sotlas-native-linux-x64.tar.gz.sha256
        if-no-files-found: error

    - name: Upload native Windows execution probe
      uses: actions/upload-artifact@v4
      with:
        name: native-windows-execution-probe
        path: ${{ runner.temp }}/native-smoke.exe
        if-no-files-found: error

  native-windows-execution:
    name: Execute Sotlas-produced PE on Windows
    runs-on: windows-latest
    needs: native-linux-package
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: native-windows-execution-probe
    - name: Run PE without host build tools
      shell: pwsh
      run: |
        $env:Path = 'C:\no-host-tools'
        $PSNativeCommandUseErrorActionPreference = $false
        & .\native-smoke.exe
        if ($LASTEXITCODE -ne 42) { throw "Native Windows probe returned $LASTEXITCODE, expected 42" }
        exit 0

  package-release-smoke:
    name: Build and install Python distribution
    runs-on: ${{ matrix.os }}
    needs: [test, backend-contract]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build wheel and source archive
      run: |
        python -m pip install --upgrade pip build
        python -m build . --outdir dist

    - name: Install wheel and smoke-test published entrypoints
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PY'
        import os
        import subprocess
        import sys
        import tempfile
        from pathlib import Path

        wheel = next(Path("dist").glob("*.whl"))
        installed = Path(tempfile.mkdtemp(prefix="sotlas-wheel-install-"))
        subprocess.run(
            [sys.executable, "-m", "pip", "install", "--no-deps", "--target", str(installed), str(wheel)],
            check=True,
        )
        env = os.environ.copy()
        env["PYTHONPATH"] = str(installed)
        source = "examples/01_hello_systems/main.sotlas"
        subprocess.run([sys.executable, "-m", "sotlas.cli", "version"], env=env, check=True)
        subprocess.run([sys.executable, "-m", "sotlas.cli", "check", source], env=env, check=True)
        output = installed / "hello.c"
        subprocess.run(
            [sys.executable, "-m", "sotlas.cli", "compile", source, "--backend", "c11", "--emit-c", "-o", str(output)],
            env=env,
            check=True,
        )
        assert output.is_file() and output.stat().st_size > 0
        PY

  vscode-extension-build:
    name: Compile VS Code extension
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install extension dependencies
      working-directory: editors/vscode
      run: npm install --no-package-lock --no-audit --no-fund
    - name: Compile extension
      working-directory: editors/vscode
      run: npm test
    - name: Package preview VSIX
      working-directory: editors/vscode
      run: npx --yes @vscode/vsce package --out sotlas-preview.vsix
    - name: Install VSIX in a clean VS Code profile
      working-directory: editors/vscode
      run: xvfb-run -a npm run test:vsix
    - name: Upload preview VSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: sotlas-vscode-preview
        path: editors/vscode/sotlas-preview.vsix
        if-no-files-found: error

  website-preview:
    name: Test and build preview website
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: web/package-lock.json
    - name: Install website dependencies
      working-directory: web
      run: npm ci
    - name: Run website tests
      working-directory: web
      run: npm test
    - name: Lint website
      working-directory: web
      run: npm run lint
    - name: Build website
      working-directory: web
      run: npm run build

name: One-time ARC loop cleanup patch

on:
  push:
    branches:
      - fix/arc-loop-double-release

permissions:
  contents: write

jobs:
  patch-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arc-loop-double-release
      - name: Apply exact duplicate-release fix
        run: python tools/_one_time_arc_loop_patch.py
      - name: Commit source fix and remove one-time helpers
        shell: bash
        run: |
          git rm .github/workflows/_one_time_arc_loop_patch.yml
          git rm tools/_one_time_arc_loop_patch.py
          git add compiler/sotlas_compile/bootstrap.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(arc): avoid duplicate shared cleanup on loop exits"
          git push origin HEAD:fix/arc-loop-double-release
